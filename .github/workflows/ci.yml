name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Validate plugin JSON
        shell: pwsh
        run: |
          Get-Content -Raw .cursor-plugin/plugin.json | ConvertFrom-Json | Out-Null
          Get-Content -Raw mcp.json | ConvertFrom-Json | Out-Null
          [scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null
